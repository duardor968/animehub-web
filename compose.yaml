name: animehub-web

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:8000/api/v1
    # Internal only — Coolify's proxy routes the domain to this port. Publishing a
    # host port (ports:) collides with other apps on the shared VPS.
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8000
      # Cloud DB is the shared self-hosted Supabase with its own schema; set in
      # Coolify as postgresql://...@<host>:5432/postgres?schema=animehub
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ANIMEAV1_BASE_URL: ${ANIMEAV1_BASE_URL:-https://animeav1.com}
    # Internal only — Coolify's proxy routes animehub-api.duardo.dev to this port.
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8000/api/v1/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
